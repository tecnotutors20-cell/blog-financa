name: Apply SEO optimization branch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'seo-adsense-optimization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo-adsense-optimization
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize and validate theme
        run: python scripts/optimize_blogger_theme.py

      - name: Commit optimized theme to SEO branch
        run: |
          if git diff --quiet -- theme-7997621208047243353.xml; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-7997621208047243353.xml
          git commit -m "Apply SEO and accessibility optimizations to Blogger theme"
          git push origin HEAD:seo-adsense-optimization
