name: Export recipes posts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-recipes-posts.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export live posts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          BLOG_ID='6682336557114829830'
          token_req=urllib.request.Request('https://oauth2.googleapis.com/token',data=urllib.parse.urlencode({
            'client_id':os.environ['GOOGLE_CLIENT_ID'],'client_secret':os.environ['GOOGLE_CLIENT_SECRET'],
            'refresh_token':os.environ['GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode(),method='POST')
          token_req.add_header('Content-Type','application/x-www-form-urlencoded')
          with urllib.request.urlopen(token_req,timeout=30) as r: token=json.load(r)['access_token']
          def get(path, params=None):
            url='https://www.googleapis.com/blogger/v3'+path
            if params:url+='?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          items=[]; page=None
          while True:
            p={'maxResults':500,'fetchBodies':True,'status':'LIVE','view':'ADMIN'}
            if page:p['pageToken']=page
            d=get(f'/blogs/{BLOG_ID}/posts',p); items += d.get('items',[]); page=d.get('nextPageToken')
            if not page:break
          out=[]
          for x in items:
            out.append({k:x.get(k) for k in ['id','title','url','published','updated','labels','content']})
          Path('recipes-site').mkdir(exist_ok=True)
          Path('recipes-site/current_posts.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-site/current_posts.json
          git commit -m "Snapshot live recipes posts" || true
          git pull --rebase origin main
          git push origin main
