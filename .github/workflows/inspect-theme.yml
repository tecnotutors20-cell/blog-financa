name: Inspect remaining demo theme elements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-theme.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find remaining demo strings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('theme-7997621208047243353.xml')
          lines = p.read_text(encoding='utf-8').splitlines()
          terms = ['TopSEO','Sitemap','Error Page','Documentation','Mega Menu','Download This Theme','Download this theme','Download Theme','About Us']
          out=[]
          for i,line in enumerate(lines):
              if any(t.casefold() in line.casefold() for t in terms):
                  a=max(0,i-4); b=min(len(lines),i+5)
                  out.append(f'--- match line {i+1} ---')
                  for j in range(a,b):
                      out.append(f'{j+1}: {lines[j]}')
          Path('debug').mkdir(exist_ok=True)
          Path('debug/theme-matches.txt').write_text('\n'.join(out) or 'NO MATCHES',encoding='utf-8')
          PY

      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/theme-matches.txt
          git commit -m "Record remaining demo theme matches" || exit 0
          git push origin main
