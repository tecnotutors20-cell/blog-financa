name: Inspect remaining demo theme elements

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-theme.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect theme structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('theme-7997621208047243353.xml').read_text(encoding='utf-8')
          out=[]

          for pat,label in [
              (r"<b:widget id='LinkList\d+'.*?</b:widget>", 'LINKLIST'),
              (r"<b:widget id='Header\d+'.*?</b:widget>", 'HEADER'),
              (r"<b:widget[^>]+type='Header'.*?</b:widget>", 'HEADER-TYPE'),
          ]:
              for m in re.finditer(pat,text,re.DOTALL|re.I):
                  block=m.group(0)
                  # Keep only settings/opening lines, enough to identify labels/links/images.
                  lines=[ln for ln in block.splitlines() if 'widget-setting' in ln or '<b:widget ' in ln or '<img' in ln or 'logo' in ln.lower() or 'image' in ln.lower()]
                  out.append(f'--- {label} ---')
                  out.extend(lines[:120])

          out.append('--- EXTERNAL URLS / DEMO-LIKE STRINGS ---')
          for line in text.splitlines():
              low=line.casefold()
              if any(k in low for k in ['templatesyard','topseo','documentation','sitemap','error page','mega menu','download','liveblogger']):
                  out.append(line)

          Path('debug').mkdir(exist_ok=True)
          Path('debug/theme-structure.txt').write_text('\n'.join(out),encoding='utf-8')
          PY

      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/theme-structure.txt
          git commit -m "Record header and menu structure" || exit 0
          git push origin main
