name: Regenerate all recipe covers as AI food photos

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-ai-recipe-covers.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Generate 45 unique recipe-specific AI food photos
        id: generate
        continue-on-error: true
        env:
          FORCE_REGENERATE: '1'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python recipes-site/sync_ai_recipe_covers.py
      - name: Commit generated photos
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes-covers-ai recipes-site/ai-cover-sync-result.txt
          git commit -m "Generate 45 unique AI food photos for recipes" || true
          git pull --rebase origin main
          git push origin main
      - name: Replace every Blogger cover
        if: steps.generate.outcome == 'success'
        id: sync
        continue-on-error: true
        env:
          SYNC_BLOGGER: '1'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          sleep 10
          python recipes-site/sync_ai_recipe_covers.py
      - name: Save final status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-site/ai-cover-sync-result.txt 2>/dev/null || true
          git commit -m "Record unique AI food cover migration" || true
          git pull --rebase origin main
          git push origin main
      - name: Fail when incomplete
        if: steps.generate.outcome != 'success' || steps.sync.outcome != 'success'
        run: exit 1
