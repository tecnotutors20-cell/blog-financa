name: Enrich SEO and AdSense content

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enrich-adsense-content.yml

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enrich institutional pages and posts
        run: python scripts/enrich_adsense_content.py

      - name: Commit enriched content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogger_pages.json content/blogger_posts.json scripts/publish_blogger.py
          git commit -m "Expand finance content for SEO and AdSense quality" || true
          git pull --rebase origin main
          git push origin main

      - name: Publish enriched content to Blogger
        id: publish
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          sleep 8
          python scripts/publish_blogger.py

      - name: Record publication result
        if: always()
        env:
          RESULT: ${{ steps.publish.outcome }}
        run: |
          printf 'outcome=%s\nrun_id=%s\n' "$RESULT" "$GITHUB_RUN_ID" > .adsense-enrichment-status
          git pull --rebase origin main
          git add .adsense-enrichment-status
          git commit -m "Record AdSense content enrichment result" || true
          git push origin main

      - name: Fail when Blogger update failed
        if: steps.publish.outcome != 'success'
        run: exit 1
