name: Publish Blogger content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-blogger.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish pages and posts to Blogger
        id: publish
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_blogger.py

      - name: Record publication status
        if: always()
        env:
          RESULT: ${{ steps.publish.outcome }}
        run: |
          printf 'outcome=%s\nrun_id=%s\ncommit=%s\n' "$RESULT" "$GITHUB_RUN_ID" "$GITHUB_SHA" > .blogger-publish-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .blogger-publish-status
          git commit -m "Record Blogger publication result" || exit 0
          git push origin main

      - name: Fail when publishing failed
        if: steps.publish.outcome != 'success'
        run: exit 1
