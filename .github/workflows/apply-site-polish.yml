name: Generate covers and finish Blogger branding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-site-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install pillow

      - name: Generate branded logo and post covers
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import textwrap

          ROOT = Path('assets/covers')
          ROOT.mkdir(parents=True, exist_ok=True)
          FONT_BOLD = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          FONT_REG = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'

          def font(path, size):
              return ImageFont.truetype(path, size)

          def vertical_gradient(size, top, bottom):
              w,h=size
              img=Image.new('RGB', size, top)
              px=img.load()
              for y in range(h):
                  t=y/max(h-1,1)
                  c=tuple(round(top[i]*(1-t)+bottom[i]*t) for i in range(3))
                  for x in range(w): px[x,y]=c
              return img

          def fit_lines(draw, text, max_width, max_lines=4):
              for size in range(64, 38, -2):
                  f=font(FONT_BOLD,size)
                  words=text.split()
                  lines=[]; cur=''
                  for word in words:
                      trial=(cur+' '+word).strip()
                      if draw.textbbox((0,0),trial,font=f)[2] <= max_width:
                          cur=trial
                      else:
                          if cur: lines.append(cur)
                          cur=word
                  if cur: lines.append(cur)
                  if len(lines)<=max_lines:
                      return f,lines
              return font(FONT_BOLD,38), textwrap.wrap(text,28)[:max_lines]

          def icon(draw, kind, box, accent):
              x0,y0,x1,y1=box
              cx=(x0+x1)//2; cy=(y0+y1)//2
              white=(255,255,255)
              if kind=='card':
                  draw.rounded_rectangle(box,26,fill=(255,255,255,35),outline=white,width=7)
                  draw.rectangle((x0+20,y0+48,x1-20,y0+78),fill=accent)
                  draw.rounded_rectangle((x0+28,y1-70,x0+105,y1-35),10,fill=white)
              elif kind=='bank':
                  draw.polygon([(cx,y0),(x1,cy-35),(x0,cy-35)],fill=white)
                  for xx in [x0+35,cx-15,x1-65]:
                      draw.rectangle((xx,cy-25,xx+30,y1-35),fill=white)
                  draw.rectangle((x0+10,y1-30,x1-10,y1-12),fill=white)
              elif kind=='shield':
                  pts=[(cx,y0),(x1-15,y0+38),(x1-30,cy+45),(cx,y1),(x0+30,cy+45),(x0+15,y0+38)]
                  draw.polygon(pts,outline=white,fill=(255,255,255,25))
                  draw.ellipse((cx-28,cy-28,cx+28,cy+28),outline=white,width=7)
                  draw.line((cx,cy-18,cx,cy+18),fill=white,width=7)
              elif kind=='gauge':
                  draw.arc((x0+20,y0+30,x1-20,y1+70),180,360,fill=white,width=12)
                  draw.line((cx,cy+45,x1-55,y0+65),fill=accent,width=12)
                  draw.ellipse((cx-14,cy+31,cx+14,cy+59),fill=white)
              elif kind=='chart':
                  draw.line((x0+22,y1-25,x0+22,y0+20),fill=white,width=7)
                  draw.line((x0+22,y1-25,x1-20,y1-25),fill=white,width=7)
                  pts=[(x0+40,y1-65),(x0+92,y1-105),(x0+145,y1-92),(x1-42,y0+50)]
                  draw.line(pts,fill=white,width=10,joint='curve')
                  for p in pts: draw.ellipse((p[0]-8,p[1]-8,p[0]+8,p[1]+8),fill=accent)
              elif kind=='check':
                  for yy in [y0+38,y0+95,y0+152]:
                      draw.rounded_rectangle((x0+18,yy,x0+55,yy+37),7,outline=white,width=5)
                      draw.line((x0+26,yy+18,x0+36,yy+28,x0+52,yy+8),fill=accent,width=6)
                      draw.line((x0+76,yy+18,x1-18,yy+18),fill=white,width=7)
              elif kind=='pix':
                  s=48
                  for dx,dy in [(0,-58),(58,0),(0,58),(-58,0)]:
                      pts=[(cx+dx,cy+dy-s//2),(cx+dx+s//2,cy+dy),(cx+dx,cy+dy+s//2),(cx+dx-s//2,cy+dy)]
                      draw.polygon(pts,outline=white)
                  draw.rounded_rectangle((cx-38,cy-5,cx+38,cy+64),16,outline=white,width=7)
                  draw.arc((cx-28,cy-38,cx+28,cy+20),180,360,fill=white,width=7)
              else:
                  for i,h in enumerate([55,90,125,165]):
                      xx=x0+25+i*45
                      draw.rounded_rectangle((xx,y1-h,xx+30,y1-15),8,fill=white)
                  draw.ellipse((x1-92,y0+24,x1-32,y0+84),fill=accent,outline=white,width=5)

          covers = [
              ('organizar-vida-financeira.png','Organização financeira','Como organizar a vida financeira do zero','bars',(20,184,166)),
              ('reserva-emergencia.png','Reserva de emergência','Como calcular, montar e onde guardar','shield',(245,180,66)),
              ('cartao-credito.png','Cartão de crédito','Fatura, pagamento mínimo e juros','card',(72,149,239)),
              ('score-credito.png','Crédito','Score de crédito: o que influencia e como melhorar','gauge',(168,85,247)),
              ('conta-digital-banco.png','Bancos','Conta digital ou banco tradicional?','bank',(37,190,120)),
              ('renda-fixa.png','Investimentos','Renda fixa para iniciantes: 8 conceitos essenciais','chart',(245,158,11)),
              ('sair-das-dividas.png','Finanças pessoais','Como sair das dívidas: método prático','check',(239,68,68)),
              ('pix-seguranca.png','Segurança financeira','Pix com segurança: reduza o risco de golpes','pix',(16,185,129)),
          ]

          for filename,category,title,kind,accent in covers:
              img=vertical_gradient((1200,630),(12,27,52),(24,55,82)).convert('RGBA')
              d=ImageDraw.Draw(img,'RGBA')
              d.ellipse((810,-160,1300,330),fill=(*accent,38))
              d.ellipse((930,270,1250,590),fill=(255,255,255,18))
              d.rounded_rectangle((70,58,290,108),22,fill=(*accent,230))
              d.text((92,69),'GUIA DO BOLSO',font=font(FONT_BOLD,22),fill='white')
              d.text((70,145),category.upper(),font=font(FONT_BOLD,24),fill=accent)
              f,lines=fit_lines(d,title,690,4)
              y=195
              for line in lines:
                  d.text((70,y),line,font=f,fill='white')
                  y += f.size + 10
              d.text((72,545),'Finanças explicadas com clareza',font=font(FONT_REG,24),fill=(220,230,239))
              d.rounded_rectangle((845,155,1110,420),48,fill=(255,255,255,18),outline=(255,255,255,35),width=2)
              icon(d,kind,(875,185,1080,390),accent)
              img.convert('RGB').save(ROOT/filename,'PNG',optimize=True)

          # Logo clean, transparent, independent from the old TopSEO artwork.
          logo=Image.new('RGBA',(520,120),(0,0,0,0))
          d=ImageDraw.Draw(logo,'RGBA')
          d.rounded_rectangle((6,20,86,100),26,fill=(20,184,166,255))
          d.text((29,31),'G',font=font(FONT_BOLD,45),fill='white')
          d.text((104,29),'Guia Do Bolso',font=font(FONT_BOLD,43),fill=(28,45,69,255))
          logo.save('assets/logo-guia-do-bolso.png','PNG',optimize=True)
          PY

      - name: Clean demo navigation and replace TopSEO logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path=Path('theme-7997621208047243353.xml')
          text=path.read_text(encoding='utf-8')
          logo='https://raw.githubusercontent.com/tecnotutors20-cell/blog-financa/main/assets/logo-guia-do-bolso.png'

          text=text.replace('Name:        TopSEO','Name:        Guia Do Bolso')

          # Header: force the new branded logo instead of the bundled TopSEO artwork.
          hp=re.compile(r"(<b:widget id='Header1'.*?</b:widget>)",re.DOTALL)
          m=hp.search(text)
          if not m: raise RuntimeError('Header1 não encontrado')
          block=m.group(1)
          block=re.sub(r"(<b:widget-setting name='displayUrl'>).*?(</b:widget-setting>)",rf"\1{logo}\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='displayHeight'>).*?(</b:widget-setting>)",r"\g<1>50\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='displayWidth'>).*?(</b:widget-setting>)",r"\g<1>220\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='sectionWidth'>).*?(</b:widget-setting>)",r"\g<1>230\2",block,count=1)
          block=re.sub(r"<img expr:alt='data:blog.title.escaped' expr:data-height='data:height' expr:data-width='data:width' expr:src='data:image'/>",f"<img alt='Guia Do Bolso' data-height='50' data-width='220' src='{logo}'/>",block,count=1)
          text=text[:m.start()]+block+text[m.end():]

          # Remove “Sobre” only from the main/mobile menu (keeps institutional page in footer/top bar).
          mp=re.compile(r"(<b:widget id='LinkList74'.*?<b:widget-settings>)(.*?)(</b:widget-settings>)",re.DOTALL)
          mm=mp.search(text)
          if not mm: raise RuntimeError('LinkList74 não encontrado')
          settings=mm.group(2)
          settings=re.sub(r"\s*<b:widget-setting name='text-6'>Sobre</b:widget-setting>","",settings)
          settings=re.sub(r"\s*<b:widget-setting name='link-6'>/p/sobre\.html</b:widget-setting>","",settings)
          text=text[:mm.start()]+mm.group(1)+settings+mm.group(3)+text[mm.end():]

          # Defensive cleanup in case any demo entries return in another LinkList.
          unwanted=('sitemap','error page','documentation','mega menu','download this theme','download theme')
          widget_pat=re.compile(r"(<b:widget id='LinkList\d+'.*?<b:widget-settings>)(.*?)(</b:widget-settings>)",re.DOTALL|re.I)
          def clean_widget(match):
              settings=match.group(2)
              pairs=re.findall(r"<b:widget-setting name='text-(\d+)'>(.*?)</b:widget-setting>",settings,re.DOTALL|re.I)
              remove=[]
              for idx,label in pairs:
                  clean=re.sub('<.*?>','',label).strip().casefold()
                  if any(term in clean for term in unwanted): remove.append(idx)
              for idx in remove:
                  settings=re.sub(rf"\s*<b:widget-setting name='text-{idx}'>.*?</b:widget-setting>","",settings,flags=re.DOTALL|re.I)
                  settings=re.sub(rf"\s*<b:widget-setting name='link-{idx}'>.*?</b:widget-setting>","",settings,flags=re.DOTALL|re.I)
              return match.group(1)+settings+match.group(3)
          text=widget_pat.sub(clean_widget,text)

          # Validate Blogger XML while tolerating legacy undeclared prefixes.
          declared=set(re.findall(r"xmlns:([A-Za-z_][\w.-]*)=",text))
          ep=set(re.findall(r"</?([A-Za-z_][\w.-]*):[A-Za-z_]",text))
          ap=set(re.findall(r"\s([A-Za-z_][\w.-]*):[A-Za-z_][\w.-]*\s*=",text))
          missing=sorted((ep|ap)-declared-{'xml','xmlns'})
          check=text
          if missing:
              attrs=''.join(f" xmlns:{p}='urn:blogger-legacy:{p}'" for p in missing)
              check=check.replace('<html ','<html'+attrs+' ',1)
          ET.fromstring(check)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit assets and theme changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets theme-7997621208047243353.xml
          git commit -m "Add branded covers and clean Blogger demo navigation" || true
          git pull --rebase origin main
          git push origin main

      - name: Publish post covers directly to Blogger
        id: publish
        continue-on-error: true
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          sleep 3
          python scripts/publish_blogger.py

      - name: Record result
        if: always()
        env:
          RESULT: ${{ steps.publish.outcome }}
        run: |
          printf 'outcome=%s\nrun_id=%s\n' "$RESULT" "$GITHUB_RUN_ID" > .site-polish-status
          git pull --rebase origin main
          git add .site-polish-status
          git commit -m "Record site polish publication result" || true
          git push origin main

      - name: Fail when Blogger update failed
        if: steps.publish.outcome != 'success'
        run: exit 1
