name: Finalize finance Blogger theme

on:
  push:
    branches:
      - main
    paths:
      - scripts/optimize_blogger_theme.py
      - .github/workflows/finalize-theme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Finalize and validate theme
        run: python scripts/optimize_blogger_theme.py

      - name: Commit finalized theme
        run: |
          if git diff --quiet -- theme-7997621208047243353.xml; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-7997621208047243353.xml
          git commit -m "Finalize Blogger theme for finance SEO and trust"
          git push origin main
