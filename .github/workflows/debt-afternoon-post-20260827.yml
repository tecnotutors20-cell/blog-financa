name: Publish afternoon debt long-tail SEO article
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debt-afternoon-post-20260827.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add article, cluster relation and cover mapping
        run: python scripts/add_debt_afternoon_20260827.py
      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogger_posts.json content/seo_clusters.json scripts/publish_blogger.py assets/covers/emprestimo-pagar-cartao-20260827.svg
          git commit -m "Add debt loan versus card article" || true
          git pull --rebase origin main
          git push origin main
      - name: Publish to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_blogger.py
      - name: Record success
        run: |
          printf 'outcome=success\nrun_id=%s\n' "$GITHUB_RUN_ID" > .afternoon-debt-status
          git pull --rebase origin main
          git add .afternoon-debt-status
          git commit -m "Record afternoon debt publication" || true
          git push origin main
