name: Sync AI recipe covers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-recipe-covers.yml
      - recipes-site/sync_ai_recipe_covers.py
  schedule:
    - cron: '10 13 * * *'
    - cron: '10 18 * * *'
    - cron: '10 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install pillow

      - name: Generate AI food photo for every post missing one
        id: generate
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python recipes-site/sync_ai_recipe_covers.py

      - name: Commit AI covers before Blogger update
        if: steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/recipes-covers-ai recipes-site/ai-cover-sync-result.txt
          git commit -m "Generate recipe-specific AI food covers" || true
          git pull --rebase origin main
          git push origin main

      - name: Sync AI covers into Blogger posts
        if: steps.generate.outcome == 'success'
        id: sync
        continue-on-error: true
        env:
          SYNC_BLOGGER: '1'
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          sleep 8
          python recipes-site/sync_ai_recipe_covers.py

      - name: Record final result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-site/ai-cover-sync-result.txt 2>/dev/null || true
          git commit -m "Record AI recipe cover sync" || true
          git pull --rebase origin main
          git push origin main

      - name: Fail when generation or sync fails
        if: steps.generate.outcome != 'success' || steps.sync.outcome != 'success'
        run: exit 1
