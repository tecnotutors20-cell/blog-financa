name: Publish evening Pix cancellation SEO article
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/evening-pix-post-20260825.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add evening Pix article and cover mapping
        run: python scripts/add_evening_pix_post_20260825.py
      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blogger_posts.json content/seo_clusters.json scripts/publish_blogger.py
          git commit -m "Add Pix scheduling evening long-tail article" || true
          git pull --rebase origin main
          git push origin main
      - name: Publish to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/publish_blogger.py
      - name: Record success
        run: |
          printf 'outcome=success\nrun_id=%s\n' "$GITHUB_RUN_ID" > .evening-pix-status
          git pull --rebase origin main
          git add .evening-pix-status
          git commit -m "Record evening Pix scheduling publication" || true
          git push origin main
