name: Fix mobile Guia Do Bolso logo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-logo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace old mobile logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path=Path('theme-7997621208047243353.xml')
          text=path.read_text(encoding='utf-8')
          logo='https://raw.githubusercontent.com/tecnotutors20-cell/blog-financa/main/assets/logo-guia-do-bolso.png'

          pat=re.compile(r"(<b:widget id='Image70'.*?</b:widget>)",re.DOTALL)
          m=pat.search(text)
          if not m:
              raise RuntimeError('Image70 não encontrado')
          block=m.group(1)
          block=re.sub(r"(<b:widget-setting name='displayUrl'>).*?(</b:widget-setting>)",rf"\1{logo}\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='displayHeight'>).*?(</b:widget-setting>)",r"\g<1>50\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='displayWidth'>).*?(</b:widget-setting>)",r"\g<1>220\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='sectionWidth'>).*?(</b:widget-setting>)",r"\g<1>230\2",block,count=1)
          block=re.sub(r"(<b:widget-setting name='link'>).*?(</b:widget-setting>)",r"\g<1>Guia Do Bolso\2",block,count=1)
          block=block.replace("<a expr:href='data:blog.homepageUrl'><img expr:alt='data:blog.title' expr:src='data:sourceUrl'/></a>",f"<a expr:href='data:blog.homepageUrl'><img alt='Guia Do Bolso' src='{logo}'/></a>")
          text=text[:m.start()]+block+text[m.end():]

          declared=set(re.findall(r"xmlns:([A-Za-z_][\w.-]*)=",text))
          ep=set(re.findall(r"</?([A-Za-z_][\w.-]*):[A-Za-z_]",text))
          ap=set(re.findall(r"\s([A-Za-z_][\w.-]*):[A-Za-z_][\w.-]*\s*=",text))
          missing=sorted((ep|ap)-declared-{'xml','xmlns'})
          check=text
          if missing:
              attrs=''.join(f" xmlns:{p}='urn:blogger-legacy:{p}'" for p in missing)
              check=check.replace('<html ','<html'+attrs+' ',1)
          ET.fromstring(check)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-7997621208047243353.xml
          git commit -m "Use Guia Do Bolso logo on mobile" || exit 0
          git push origin main
