name: Apply Blogger theme optimization

on:
  push:
    branches:
      - seo-adsense-optimization
    paths:
      - scripts/optimize_blogger_theme.py
      - .github/workflows/apply-theme-optimization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Optimize and validate Blogger XML
        run: python scripts/optimize_blogger_theme.py

      - name: Commit optimized theme
        run: |
          if git diff --quiet -- theme-7997621208047243353.xml; then
            echo "No theme changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme-7997621208047243353.xml
          git commit -m "Optimize Blogger theme for SEO and accessibility"
          git push
