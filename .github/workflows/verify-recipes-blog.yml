name: Verify optimized recipes Blogger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-recipes-blog.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit live optimized content
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import collections,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          BLOG_ID='6682336557114829830'
          token_req=urllib.request.Request('https://oauth2.googleapis.com/token',data=urllib.parse.urlencode({'client_id':os.environ['GOOGLE_CLIENT_ID'],'client_secret':os.environ['GOOGLE_CLIENT_SECRET'],'refresh_token':os.environ['GOOGLE_REFRESH_TOKEN'],'grant_type':'refresh_token'}).encode(),method='POST')
          token_req.add_header('Content-Type','application/x-www-form-urlencoded')
          with urllib.request.urlopen(token_req,timeout=30) as r: token=json.load(r)['access_token']
          def get(path,params=None):
            url='https://www.googleapis.com/blogger/v3'+path
            if params:url+='?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          posts=[]; pt=None
          while True:
            p={'maxResults':500,'fetchBodies':True,'status':'LIVE','view':'ADMIN'}
            if pt:p['pageToken']=pt
            d=get(f'/blogs/{BLOG_ID}/posts',p);posts+=d.get('items',[]);pt=d.get('nextPageToken')
            if not pt:break
          pages=[];pt=None
          while True:
            p={'maxResults':500,'fetchBodies':False,'view':'ADMIN'}
            if pt:p['pageToken']=pt
            d=get(f'/blogs/{BLOG_ID}/pages',p);pages+=d.get('items',[]);pt=d.get('nextPageToken')
            if not pt:break
          norm=lambda s:re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()
          titles=collections.defaultdict(list)
          details=[]
          for x in posts:
            c=x.get('content','');title=x.get('title','')
            titles[norm(title)].append({'id':x.get('id'),'title':title,'url':x.get('url')})
            imgs=re.findall(r'<img\b[^>]*\bsrc=["\']([^"\']+)',c,re.I)
            details.append({'id':x.get('id'),'title':title,'url':x.get('url'),'labels':x.get('labels',[]),'has_author':'Equipe Editorial do Receitas Para Pequenos' in c,'has_recipe_schema':'application/ld+json' in c and '"@type": "Recipe"' in c,'images':imgs[:3],'has_image':bool(imgs),'bing_hotlink':any('bing.com' in u or 'bing.net' in u for u in imgs),'medicalish_title':any(k in title.lower() for k in ['imunidade','cura','anemia','medicinal','detox'])})
          out={'posts':len(posts),'pages':len(pages),'page_titles':[p.get('title') for p in pages],'duplicate_titles':[v for v in titles.values() if len(v)>1],'missing_author':[d['title'] for d in details if not d['has_author']],'missing_recipe_schema':[d['title'] for d in details if not d['has_recipe_schema']],'missing_image':[d['title'] for d in details if not d['has_image']],'bing_hotlinks':[d['title'] for d in details if d['bing_hotlink']],'medicalish_titles':[d['title'] for d in details if d['medicalish_title']],'details':details}
          Path('recipes-site/live-verification.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recipes-site/live-verification.json
          git commit -m "Verify live Receitas Para Pequenos optimization" || true
          git pull --rebase origin main
          git push origin main
